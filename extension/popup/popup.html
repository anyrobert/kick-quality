<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kick Quality</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Preferred quality</h1>
  <form id="qualities">
    <label><input type="radio" name="quality" value="1080"> 1080p</label>
    <label><input type="radio" name="quality" value="720"> 720p</label>
    <label><input type="radio" name="quality" value="480"> 480p</label>
    <label><input type="radio" name="quality" value="360"> 360p</label>
    <label><input type="radio" name="quality" value="160"> 160p</label>
    <label><input type="radio" name="quality" value="auto"> Auto (Kick default)</label>
  </form>
  <p class="hint">Applies to the next stream you open. If a stream lacks this quality, Kick falls back to Auto.</p>
  <button id="reload" type="button" hidden>Reload Kick tab to apply now</button>
  <script src="popup.js"></script>
</body>
</html>
